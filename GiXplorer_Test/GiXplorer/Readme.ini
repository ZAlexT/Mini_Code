## 18. Código / mantenimiento

Convención:

Cada archivo debe identificarse al principio cuando proceda:

```javascript
// GiXplorer_app.js
```

```css
/* GiXplorer_main.css */
```

```html
<!-- GiXplorer_index.html -->
```

Comentarios:

* Claros.
* Escuetos.
* Solo donde aporten comprensión futura.

Al modificar código existente:

**Preferencia:**

```text
Busca A
→ sustituye hasta B
```

o:

```text
Añade entre C y D
```

Evitar instrucciones ambiguas y evitar duplicar bloques que ya existan.

