## 17. Interfaz

La interfaz actual funciona y visualmente está bien.

Mantener como referencia:

* Tree a la izquierda.
* Main a la derecha.
* Configuración en panel lateral derecho.
* Footer/status bar inferior.
* El panel de Configuración debe terminar antes del footer, coincidiendo exactamente con su inicio.

