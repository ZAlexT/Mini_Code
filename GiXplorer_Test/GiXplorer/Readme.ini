# GiXplorer — Estado y pendientes

**Versión actual:** 0.1.0
**Estado:** Interfaz funcional · Preparación para conexión API

---

## 1. Configuración — pendiente de ajuste visual

### 1.1 Panel lateral derecho

* La parte superior está correcta.
* El panel de Configuración debe **recortarse por abajo**.
* Su límite inferior debe coincidir exactamente con el **inicio de la barra inferior de estado/footer**.
* No debe solaparla ni quedar por debajo.
* No modificar Tree/Main por este motivo.

### 1.2 Indicador de estado

Añadir junto al estado de conexión:

* 🔴 Rojo + centro negro → **Desconectado**
* 🟠 Naranja → **Conectando…**
* 🟢 Verde → **Conectado**
* 🔴 Rojo → **Error**

El punto será CSS, aproximadamente **3×3 px**, sin SVG ni imágenes.

Siempre habrá también **texto**, para no depender únicamente del color.

---

## 2. GitHub — conexión API

Cambiar el botón:

```text
Probar conexión
```

por:

```text
Conectar
```

Implementar inicialmente:

```text
Conectar
   ↓
GitHub API
   ↓
GET /user
   ↓
Autenticación
   ↓
Estado conectado/error
```

### Consideraciones

* Usuario opcional.
* Token opcional.
* Sin token → posibilidad de utilizar API pública.
* Con token → API autenticada.
* No implementar todavía escritura.
* No guardar el estado de conexión como credencial.

---

## 3. GitHub — Token

Añadir ayuda en Configuración.

Debe explicar brevemente:

* Cómo generar un token.
* Diferencia entre **Fine-grained PAT** y **Classic PAT**.
* Fine-grained → recomendado.
* Classic → compatible.
* Usar inicialmente los permisos mínimos necesarios.
* El token nunca debe aparecer en el código ni en el repositorio.

Añadir enlace al proveedor:

```text
https://github.com/settings/personal-access-tokens
```

El enlace debe formar parte del contrato/configuración del proveedor.

---

## 4. Credenciales

Mantener:

```text
Usuario
Token
```

* Token protegido/no incluido en código.
* Guardado mediante `chrome.storage`.
* Las credenciales de GitHub y Codeberg son independientes.
* No obligar al usuario a configurar un token para instalar/utilizar la extensión.

---

## 5. Proveedores

Mantener arquitectura independiente por proveedor.

Actualmente:

```text
GitHub
Codeberg
```

Cada proveedor deberá tener, como mínimo:

```text
name
webUrl
apiUrl
tokenUrl
```

La arquitectura debe permitir añadir posteriormente otro servicio similar mediante un bloque/proveedor independiente.

No mezclar la lógica específica de GitHub con la de Codeberg.

---

## 6. GitHub — repositorios reales

Una vez funcione `Conectar`:

* Obtener los repositorios reales del usuario.
* Sustituir el `demoTree`.
* Mostrar repositorios en Tree.
* Poder seleccionar un repositorio.
* Preparar navegación por carpetas y archivos.

---

## 7. Codeberg

Después de estabilizar GitHub:

* Implementar conexión.
* Token/credenciales independientes.
* API propia.
* Estado independiente.
* Repositorios reales.
* Cambio entre GitHub y Codeberg sin perder la configuración del otro.

---

## 8. Tree

Estado actual:

```text
Ancho: 190 px
```

Funciona correctamente.

Mantener:

* Posibilidad de redimensionar.
* Guardar el tamaño en configuración/storage.
* No modificarlo mientras se corrige el panel de Configuración.

---

## 9. Idioma

Actualmente:

```text
ES
EN
```

El sistema i18n ya está implementado.

Debe mantenerse:

* Textos normales → `data-i18n`
* Placeholders → `data-i18n-placeholder`
* Tooltips → `data-i18n-title`
* Textos generados por JavaScript → `t(...)`

### Regla para futuras funciones

Toda nueva función debe incorporar desde el principio sus textos:

```text
ES + EN
```

No introducir textos visibles directamente en `app.js` cuando sean traducibles.

---

## 10. Tema

Opciones:

```text
Oscuro
Claro
Sistema
```

Por defecto:

```text
Oscuro
```

El valor se guarda en `chrome.storage`.

---

## 11. Confirmaciones

Actualmente existen:

```text
Eliminar
Mover
Sobrescribir
```

Funcionamiento deseado:

* Marcadas → pedir confirmación.
* Desmarcadas → ejecutar sin preguntar.
* `Restaurar confirmaciones` → vuelve a activar las confirmaciones.
* No es necesario resetear todos los datos.

---

## 12. Restablecer datos

`Restablecer datos` funciona.

Debe:

* Pedir confirmación.
* Tener el mensaje traducido ES/EN.
* Eliminar configuración/credenciales/datos de usuario.
* Mantener intacta la extensión y su código.

---

## 13. Operaciones sobre archivos — fase posterior

No implementar todavía.

Cuando llegue esta fase:

### Selección múltiple

* Marcar varios archivos/carpetas.
* Mostrar claramente los elementos seleccionados.

### Eliminar

* Una confirmación para toda la operación múltiple.
* No preguntar archivo por archivo si la confirmación está activada.

### Mover

* Selección múltiple.
* Una única confirmación.

### Sobrescribir

* Confirmación según la configuración del usuario.

### Recuperación visual

* Si un elemento deja de aparecer en Tree por alguna acción, debe poder recuperar su aparición **sin tener que hacer Reset de todos los datos**.

---

## 14. Contrato de proveedor

Cada proveedor debe indicar claramente:

```text
Nombre
URL web
URL API
URL para generar token
Tipo de autenticación
```

Esto permitirá añadir nuevos proveedores mediante un módulo identificable y comprensible.

---

## 15. Seguridad

Revisar antes de publicar:

* No incluir tokens en código.
* No incluir tokens en Git.
* No incluir tokens en logs/console.
* Revisar permisos del `manifest.json`.
* Mantener permisos mínimos.
* Separar credenciales de configuración visual.
* Revisar almacenamiento de `chrome.storage`.
* Evitar exponer credenciales accidentalmente en errores.

