# V0.2 — GitHub real

Una vez terminada la base:

1. Autenticación GitHub.
2. Probar conexión.
3. Obtener repositorios.
4. Sustituir `demoTree`.
5. Mostrar árbol real.
6. Cargar carpetas bajo demanda.
7. Mostrar detalles de archivos.
8. Obtener ramas/commits según necesidad.

Inicialmente **solo lectura**.

---

# Operaciones futuras

* Selección múltiple.
* Mover archivos.
* Renombrar archivos.
* Borrar archivos.
* Sobrescribir.
* Vista previa de cambios.
* Agrupar múltiples operaciones en un único commit cuando el proveedor lo permita.

Ejemplo:

```text
