Extensión Chromium / Vivaldi para explorar y gestionar repositorios GitHub, Codeberg y futuros proveedores.

## Estado actual

**Versión:** V0.1 — interfaz funcional.

La extensión desempaquetada ya:

* Carga correctamente en Vivaldi.
* Abre `index.html` mediante `background.js`.
* Tiene interfaz de árbol + panel principal.
* Tema claro/oscuro.
* Buscador.
* Tree redimensionable.
* Datos de prueba mediante `demoTree`.

Los iconos del Manifest quedan pendientes.

---

# Próximo objetivo — V0.1.1

Antes de conectar APIs:

## 1. Arquitectura

Separar claramente:

```text
GiXplorer/
├── manifest.json
├── background.js
├── index.html
│
├── css/
│   └── main.css
│
└── js/
    ├── app.js
    ├── storage.js
    ├── provider-manager.js
    └── providers/
        ├── provider-interface.js
        ├── github-provider.js
        └── codeberg-provider.js
```

El núcleo no debe contener lógica específica de GitHub/Codeberg.

---

## 2. Providers

Arquitectura preparada para futuros forks y nuevos servicios.

Cada proveedor debe definir:

```text
id
name
website
api
auth
capabilities
contractVersion
```

Capacidades previstas:

```text
read
write
move
delete
rename
branches
commits
```

GitHub, Codeberg y futuros proveedores deben implementar el mismo contrato.

---

## 3. Tree

* Ancho inicial aproximado: **220 px**.
* Separador más a la izquierda.
* Redimensionable.
* Guardar el ancho en `chrome.storage`.
* Preparado para futura adaptación Tree arriba / Main debajo.
* Compatible con ventana completa y, si es posible, panel lateral de Vivaldi.

---

## 4. Configuración

No incluir usuario ni token por defecto.

Credenciales independientes:

```text
github:
    user
    token

codeberg:
    user
    token
```

GitHub y Codeberg pueden permanecer conectados simultáneamente.

`activeProvider` solamente determina qué proveedor está seleccionado.

---

## 5. Seguridad

```text
Token no incluido / protegido en chrome.storage
chrome.storage autentica sobre las APIs
```

* Nunca incluir tokens en el código.
* Nunca subir tokens al repositorio.
* No utilizar servidor intermedio para las APIs.
* Llamadas directas desde la extensión al proveedor.
* Mínimo privilegio.
* GitHub: preferentemente fine-grained token.
* Empezar con permisos de lectura.
* CSP estricta.
* Sin scripts remotos.
* Sin `eval()`.
* No almacenar innecesariamente contenido completo de archivos.
* Separar credenciales, configuración y caché.

---

## 6. Confirmaciones

Operaciones destructivas/múltiples:

* borrar
* mover
* sobrescribir

Deben permitir:

```text
☑ No volver a mostrar
```

Las confirmaciones serán independientes:

```text
confirmations:
    delete
    move
    overwrite
```

Desde Configuración se podrán volver a activar **sin hacer Reset general**.

---

## 7. Reset

Debe permitir restablecer:

* Usuarios.
* Tokens.
* Configuración.
* Preferencias.

La caché será independiente.

Posible separación futura:

```text
Restablecer datos
Limpiar caché
Restaurar confirmaciones
```

