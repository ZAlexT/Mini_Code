<script>
(function(){
	function init(){
		var track = document.getElementById('upcomingTrack');
		if (!track) return;
		var slider = track.closest('.upcoming-slider');
		if (slider) {
			slider.classList.add('is-marquee');
			slider.classList.remove('is-static'); // ensure CSS doesn't force no-scroll
		}
		// Disable snap for smooth marquee
		try { track.style.scrollSnapType = 'none'; } catch(e) {}
		var maxScroll = Math.max(0, track.scrollWidth - track.clientWidth);
		if (maxScroll < 4) {
			// Not enough overflow; duplicate children once to create a loopable area
			var children = Array.prototype.slice.call(track.children);
			if (children.length > 0) {
				children.forEach(function(node){ track.appendChild(node.cloneNode(true)); });
				maxScroll = Math.max(0, track.scrollWidth - track.clientWidth);
				// If still small, clone once more
				if (maxScroll < 4) {
					children.forEach(function(node){ track.appendChild(node.cloneNode(true)); });
					maxScroll = Math.max(0, track.scrollWidth - track.clientWidth);
				}
			}
		}
		if (maxScroll < 4) return; // still nothing to scroll
		var speedPerSecond = 40; // px/sec (smoother)
		var lastTs = 0;
		var rafId;
		function tick(ts){
			if (!lastTs) lastTs = ts;
			var dt = (ts - lastTs) / 1000; // seconds
			lastTs = ts;
			var delta = speedPerSecond * dt;
			track.scrollLeft += delta;
			if (track.scrollLeft >= maxScroll - 1) {
				track.scrollLeft = 0;
			}
			rafId = requestAnimationFrame(tick);
		}
		rafId = requestAnimationFrame(tick);
		track.addEventListener('mouseenter', function(){ if (rafId) { cancelAnimationFrame(rafId); rafId = null; } });
		track.addEventListener('mouseleave', function(){ if (!rafId) { lastTs = 0; rafId = requestAnimationFrame(tick); } });
		window.addEventListener('resize', function(){ maxScroll = Math.max(0, track.scrollWidth - track.clientWidth); });
	}
	if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
	else { init(); }
})();
</script>



