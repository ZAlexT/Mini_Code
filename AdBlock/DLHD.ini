	<div class="schedule schedule--compact collapsible-content js-remote-schedule" data-endpoint="/schedule-api.php?source=extra_sd" data-loading-message="Loading Extra SD Schedule..." data-error-message="Unable to load Extra SD Schedule." data-retry-text="Retry" style="display: none;">
		<div class="schedule__status" aria-live="polite">Preparing schedule…</div>
	</div>
