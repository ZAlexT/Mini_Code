<script>
document.addEventListener('DOMContentLoaded', function() {

	var remoteSections = document.querySelectorAll('.js-remote-schedule');

	function resetEventBlocks(scope) {
		(scope || document).querySelectorAll('.schedule__event').forEach(function(ev){
			var body = ev.querySelector('.schedule__channels');
			if (body) body.style.display = 'none';
			var header = ev.querySelector('.schedule__eventHeader');
			if (header) header.setAttribute('aria-expanded', 'false');
			var chev = ev.querySelector('.schedule__chevron');
			if (chev) { chev.classList.remove('fa-chevron-down'); chev.classList.add('fa-chevron-right'); }
		});
	}

	function resetCategoryBlocks(scope) {
		(scope || document).querySelectorAll('.schedule__category').forEach(function(cat){
			var icon = cat.querySelector('.cat-icon');
			if (icon) {
				if (cat.classList.contains('is-expanded')) {
					icon.classList.remove('fa-chevron-right');
					icon.classList.add('fa-chevron-down');
				} else {
					icon.classList.remove('fa-chevron-down');
					icon.classList.add('fa-chevron-right');
				}
			}
			var header = cat.querySelector('.schedule__catHeader');
			if (header) {
				header.setAttribute('aria-expanded', cat.classList.contains('is-expanded') ? 'true' : 'false');
			}
		});
	}

	function renderStatus(container, text, isError) {
		if (!container) return null;
		container.innerHTML = '';
		var div = document.createElement('div');
		div.className = 'schedule__status' + (isError ? ' schedule__status--error' : '');
		div.textContent = text;
		container.appendChild(div);
		return div;
	}

	function appendRetryButton(container, text) {
		var btn = document.createElement('button');
		btn.type = 'button';
		btn.className = 'btn btn--small schedule__retry';
		btn.textContent = text;
		container.appendChild(btn);
		return btn;
	}

	function loadRemoteSchedule(container) {
		if (!container || container.getAttribute('data-loaded') === '1' || container.getAttribute('data-loading') === '1') {
			return;
		}
		var endpoint = container.getAttribute('data-endpoint');
		if (!endpoint) return;
		container.setAttribute('data-loading', '1');
		renderStatus(container, container.getAttribute('data-loading-message') || 'Loading schedule...', false);
		fetch(endpoint, {credentials: 'same-origin', headers: {'Accept': 'application/json'}})
			.then(function(resp){
				if (!resp.ok) throw new Error('Network response was not ok');
				return resp.json();
			})
			.then(function(payload){
				if (!payload || !payload.success || typeof payload.html !== 'string') {
					var errMsg = (payload && payload.error) ? payload.error : 'Unexpected response.';
					throw new Error(errMsg);
				}
				container.innerHTML = payload.html;
				container.setAttribute('data-loaded', '1');
				container.removeAttribute('data-loading');
				resetEventBlocks(container);
				resetCategoryBlocks(container);
			})
			.catch(function(error){
				console.error('Schedule fetch failed:', error);
				container.removeAttribute('data-loading');
				container.removeAttribute('data-loaded');
				renderStatus(container, container.getAttribute('data-error-message') || 'Unable to load schedule.', true);
				var retryBtn = appendRetryButton(container, container.getAttribute('data-retry-text') || 'Retry');
				retryBtn.addEventListener('click', function(ev){
					ev.preventDefault();
					loadRemoteSchedule(container);
				});
			});
	}
	window.loadRemoteSchedule = loadRemoteSchedule;

	remoteSections.forEach(function(section){
		if (section.getAttribute('data-load-immediate') === '1') {
			loadRemoteSchedule(section);
		}
	});

	var input = document.getElementById('scheduleSearch');
	function filter() {
		if (!input) return;
		var q = input.value.trim().toLowerCase();
		var events = document.querySelectorAll('.schedule__event');
		events.forEach(function(ev) {
			var header = ev.querySelector('.schedule__eventHeader');
			var hay = header ? (header.getAttribute('data-title') || '') : '';
			var chs = ev.querySelectorAll('.schedule__channels a');
			var match = hay.indexOf(q) !== -1;
			if (!match) {
				chs.forEach(function(a){ if (a.getAttribute('data-ch') && a.getAttribute('data-ch').indexOf(q) !== -1) match = true; });
			}
			ev.style.display = match ? '' : 'none';

			var body = ev.querySelector('.schedule__channels');
			var chev = ev.querySelector('.schedule__chevron');
			if (!match) {
				if (body) body.style.display = 'none';
				ev.classList.remove('is-open');
				if (chev) { chev.classList.remove('fa-chevron-down'); chev.classList.add('fa-chevron-right'); }
				if (header) header.setAttribute('aria-expanded','false');
			}
		});
		var cats = document.querySelectorAll('.schedule__category');
		cats.forEach(function(cat){
			var body = cat.querySelector('.schedule__categoryBody');
			var anyVisible = body && body.querySelector('.schedule__event:not([style*="display: none"])');
			if (q) {
				cat.classList.toggle('is-expanded', !!anyVisible);
				var header = cat.querySelector('.schedule__catHeader'); 
				if (header) header.setAttribute('aria-expanded', cat.classList.contains('is-expanded') ? 'true' : 'false');
				var icon = cat.querySelector('.cat-icon');
				if (icon) {
					if (cat.classList.contains('is-expanded')) { icon.classList.remove('fa-chevron-right'); icon.classList.add('fa-chevron-down'); }
					else { icon.classList.remove('fa-chevron-down'); icon.classList.add('fa-chevron-right'); }
				}
			} else {
				cat.classList.remove('is-expanded');
				var header2 = cat.querySelector('.schedule__catHeader'); if (header2) header2.setAttribute('aria-expanded', 'false');
				var icon2 = cat.querySelector('.cat-icon');
				if (icon2) { icon2.classList.remove('fa-chevron-down'); icon2.classList.add('fa-chevron-right'); }
			}
		});
	}
	if (input) {
		input.addEventListener('input', filter);
		input.addEventListener('change', filter);
	}

	function onCatToggle(e){
		var target = e.target.closest && e.target.closest('.schedule__catHeader');
		if (!target) return;
		var cat = target.parentElement;
		cat.classList.toggle('is-expanded');
		target.setAttribute('aria-expanded', cat.classList.contains('is-expanded') ? 'true' : 'false');

		var icon = target.querySelector('.cat-icon');
		if (icon) {
			if (cat.classList.contains('is-expanded')) {
				icon.classList.remove('fa-chevron-right'); icon.classList.add('fa-chevron-down');
			} else {
				icon.classList.remove('fa-chevron-down'); icon.classList.add('fa-chevron-right');
			}
		}
	}
	document.addEventListener('click', onCatToggle);
	document.addEventListener('keydown', function(e){ if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('schedule__catHeader')) { e.preventDefault(); onCatToggle(e); } });

	var tzSel = document.getElementById('tzSelect');
	function pad(n){ return (n<10?'0':'')+n; }
	function parseHHMM(s){ var m = /^([0-2]?\d):([0-5]\d)$/.exec(s); return m? {h:parseInt(m[1],10), m:parseInt(m[2],10)}:null; }
	function toMinutes(t){ return t.h*60 + t.m; }
	function fromMinutes(min){ min = (min%(24*60)+24*60)%(24*60); var h = Math.floor(min/60), m = min%60; return pad(h)+':'+pad(m); }
	function currentGmtOffsetMinutes(){ return -new Date().getTimezoneOffset(); }
	function buildOptions(){
		var offsets = []; for (var i=-24; i<=28; i++) offsets.push(i*30);
		var frag = document.createDocumentFragment();
		var saved = localStorage.getItem('tzOffsetMin');
		var preferred = saved !== null ? parseInt(saved,10) : currentGmtOffsetMinutes();
		offsets.forEach(function(min){
			var sign = min>=0?'+':'-'; var abs = Math.abs(min); var hh = Math.floor(abs/60); var mm = abs%60; var label = 'GMT ' + sign + pad(hh) + ':' + pad(mm);
			var opt = document.createElement('option'); opt.value = String(min); opt.textContent = label; if (min===preferred) opt.selected = true; frag.appendChild(opt);
		});
		if (tzSel) tzSel.appendChild(frag);
		applyOffset(preferred);
	}
	function applyOffset(offsetMin){
		var nodes = document.querySelectorAll('.schedule__time[data-time]');
		nodes.forEach(function(node){
			var src = node.getAttribute('data-time'); var t = parseHHMM(src);
			if (!t) return; var base = toMinutes(t);
			var adj = base + offsetMin; node.textContent = fromMinutes(adj);
		});
	}
	if (tzSel) {
		buildOptions();
		tzSel.addEventListener('change', function(){ var v=parseInt(this.value,10)||0; localStorage.setItem('tzOffsetMin', String(v)); applyOffset(v); });
	}

	resetEventBlocks(document);
	resetCategoryBlocks(document);
});
</script>


